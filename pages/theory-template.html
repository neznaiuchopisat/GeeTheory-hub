<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Зареждане на теория...</title>
    <link rel="stylesheet" href="../assets/css/books.css">
    <style>
        .theory-content {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            color: white;
            background: var(--surface);
            border: 3px solid var(--primary-blue);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }
        #game-icon {
            width: 50px;
            height: auto;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }

        #theory-name {
            /* Лека сянка, която помага на текста да изпъкне върху всякакъв фон */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); 
            font-size: 2.5rem;
            margin: 0;
            transition: color 0.5s ease; /* Плавна смяна на цвета */
        }

        /* Допълнителен стил за описанието, за да е четимо */
        #theory-description {
            font-size: 1.1rem;
            line-height: 1.7;
        }
    </style>
</head>
<body class="books-page">
    <div class="theory-content" id="theory-box">
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
            <img id="game-icon" src="" alt="" style="display: none;">
            <h1 id="theory-name" style="margin: 0;">Заглавие</h1>
        </div>
        <hr id="theory-hr" style="border: 0; border-top: 2px solid var(--primary-blue); margin-bottom: 20px;">
        <div id="theory-description">
            <!-- Тук ще се появи текстът -->
        </div>
        <br>
        <a href="books.html" style="color: inherit; text-decoration: underline; font-weight: bold;">← Върни се в библиотеката</a>
    </div>

    <script src="../assets/js/theories.js"></script>
    <script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const theoryId = params.get('id');
        const data = theoriesData[theoryId];

        // Функция за интелигентен контраст
        function getContrastColor(hexcolor) {
            if (!hexcolor || hexcolor === "transparent") return "white";
            const cleanHex = hexcolor.replace('#', '');
            const r = parseInt(cleanHex.slice(0, 2), 16);
            const g = parseInt(cleanHex.slice(2, 4), 16);
            const b = parseInt(cleanHex.slice(4, 6), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        if (data) {
            const box = document.getElementById('theory-box');
            const title = document.getElementById('theory-name');
            const icon = document.getElementById('game-icon');
            const hr = document.getElementById('theory-hr');

            // Попълване на текст
            title.innerText = data.title;
            document.getElementById('theory-description').innerHTML = data.content;
            document.title = data.title;

            // Икона
            if (data.icon && icon) {
                icon.src = data.icon;
                icon.style.display = "block";
            }

            // ПРИЛАГАНЕ НА ЦВЕТОВЕ (с прескачане на CSS ограниченията)
            if (data.accentColor) {
                // Сменяме фона
                box.style.setProperty('background-color', data.accentColor, 'important');
                
                // Изчисляваме контрастния цвят (черен или бял)
                const textColor = getContrastColor(data.accentColor);
                
                // Налагаме цвета върху заглавието и текста със сила (!important)
                title.style.setProperty('color', textColor, 'important');
                box.style.setProperty('color', textColor, 'important');

                // Оправяме и линка за връщане
                const backLink = document.querySelector('.back-link') || document.querySelector('a[href*="books.html"]');
                if (backLink) {
                    backLink.style.setProperty('color', textColor, 'important');
                }
            }

            if (data.borderColor) {
                box.style.setProperty('border-color', data.borderColor, 'important');
                if (hr) hr.style.setProperty('border-color', data.borderColor, 'important');
            }
        } else {
            document.getElementById('theory-name').innerText = "Теорията не е намерена";
        }
    };
    </script>
</body>
</html>
