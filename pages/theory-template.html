<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    
    <title id="page-title">Зареждане на теория...</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gabriela&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../assets/css/styles.css">
    
    </head>
<body class="theory-template">
    <div class="theory-content" id="theory-box">
        <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
            <img id="game-icon" src="" alt="" style="display: none;">
            <!-- Важно: Тук ID-то е правилно -->
            <h1 id="theory-name" style="margin: 0;">Теория не е намерена\ е в процес на добавянето</h1>
        </div>
        <hr id="theory-hr" style="border: 0; border-top: 2px solid var(--primary-blue); margin-bottom: 20px;">
        <div id="theory-description"></div>
        <br>
        <!-- ДОБАВИ КЛАСА back-link ТУК -->
        <a href="books.html" class="back-link" style="color: inherit; text-decoration: underline; font-weight: bold;">← Върни се в библиотеката</a>
    </div>

    <script src="../assets/js/theories.js"></script>
    <script>
    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const theoryId = params.get('id');
        const data = theoriesData[theoryId];

        function getContrastColor(hexcolor) {
            if (!hexcolor || hexcolor === "transparent") return "white";
            const cleanHex = hexcolor.replace('#', '');
            const r = parseInt(cleanHex.slice(0, 2), 16);
            const g = parseInt(cleanHex.slice(2, 4), 16);
            const b = parseInt(cleanHex.slice(4, 6), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        if (data) {
            const box = document.getElementById('theory-box');
            const title = document.getElementById('theory-name');
            const description = document.getElementById('theory-description');
            const icon = document.getElementById('game-icon');

            // 1. Попълване на съдържанието
            if (title) title.innerText = data.title;
            if (description) description.innerHTML = data.content;
            document.title = data.title;

            // 2. Икона (добавихме логиката за показване)
            if (data.icon && icon) {
                icon.src = data.icon;
                icon.style.display = "block";
            }

            // 3. Цветове и контраст
            if (data.accentColor && box) {
                box.style.setProperty('background-color', data.accentColor, 'important');
                const textColor = getContrastColor(data.accentColor);
                
                if (title) title.style.setProperty('color', textColor, 'important');
                if (description) description.style.setProperty('color', textColor, 'important');
                
                // Сега back-link ще работи, защото го добавихме в HTML-а по-горе
                const backLink = box.querySelector('.back-link');
                if (backLink) backLink.style.setProperty('color', textColor, 'important');
            }
            
            if (data.borderColor) {
                const hr = document.getElementById('theory-hr');
                box.style.setProperty('border-color', data.borderColor, 'important');
                if (hr) hr.style.setProperty('border-top-color', data.borderColor, 'important');
            }
        }
    };
    </script>
</body>
</html>
