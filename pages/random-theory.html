    <script>
        function getContrastColor(hexcolor) {
            if (!hexcolor || hexcolor === "transparent") return "white";
            // Если фон совсем черный (как в Undertale), возвращаем белый текст
            if (hexcolor === "#000000") return "white";
            
            const cleanHex = hexcolor.replace('#', '');
            const r = parseInt(cleanHex.slice(0, 2), 16);
            const g = parseInt(cleanHex.slice(2, 4), 16);
            const b = parseInt(cleanHex.slice(4, 6), 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        function showRandomTheory() {
            const keys = Object.keys(theoriesData);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const data = theoriesData[randomKey];

            if (data) {
                const card = document.getElementById('theory-card');
                const title = document.getElementById('theory-name');
                const desc = document.getElementById('theory-description');
                const icon = document.getElementById('game-icon-random');
                const hr = document.getElementById('theory-hr');
                const btn = document.getElementById('random-btn');

                // 1. Устанавливаем цвета фона и границ
                card.style.setProperty('background-color', data.accentColor, 'important');
                card.style.borderColor = data.borderColor;

                // 2. Считаем контрастный цвет для ВСЕГО текста
                const textColor = getContrastColor(data.accentColor);

                // 3. Применяем цвет ко всем элементам
                title.style.setProperty('color', textColor, 'important');
                desc.style.setProperty('color', textColor, 'important');
                hr.style.setProperty('border-top-color', textColor, 'important');

                // 4. Обновляем контент
                title.innerText = data.title;
                desc.innerHTML = data.content;
                
                if (data.icon) {
                    icon.src = data.icon;
                    icon.style.display = "block";
                }

                // 5. Кнопку оставляем синей (или делаем её тоже контрастной, если хочешь)
                // Чтобы кнопка не терялась, можно добавить ей обводку контрастным цветом
                btn.style.boxShadow = `0 0 15px ${data.borderColor}`;
            }
    }
</script>
